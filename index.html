<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoParachute Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="fonts.googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="video-background">
        <!-- The video element for the background -->
        <video autoplay loop muted playsinline poster="fallback-image.jpg">
            <source src="background.mp4" type="video/mp4">
            <!-- Fallback text for browsers that don't support the video tag -->
            Your browser does not support the video tag.
        </video>
    </div>
    <!-- Content Overlay -->
    <div class="content-overlay">
        <header>
            <div class="container nav-container">
                <!-- Replaced text with an image tag -->
                <div class="logo">
                    <img src="assets/UBL_new_logo.png" alt="UnBalanced Load Productions" class="logo-img">
                </div>
                <nav>
                    <a href="#">Work</a>
                    <a href="#">Services</a>
                    <a href="#">Contact</a>
                </nav>
            </div>
        </header>

        <main class="hero-main">
            <div class="container hero-container">
                <h1>We Help Brands Tell Their Stories Through <span class="highlight">Video</span>.</h1>
                <a href="#" class="cta-button">View Our Work</a>
            </div>
        </main>
    </div>
</body>
</html>
